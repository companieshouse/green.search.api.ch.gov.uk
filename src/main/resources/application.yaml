spring:
  application:
    name: green.search.api.ch.gov.uk
  jackson:
    mapper:
      sort-properties-alphabetically: false
server:
  servlet:
    context-path: /green
management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /search
      path-mapping:
        health: healthcheck
  endpoint:
    health:
      enabled: true
      show-details: never
  opentelemetry:
    enabled: ${OTEL_LOG_ENABLED:false}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
